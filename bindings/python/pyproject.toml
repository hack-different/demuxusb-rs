[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "demuxusb"
version = "0.1.0"
description = "Readers for Total Phase USB analyzer captures (Data Center .tdc files)"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"

[project.urls]
Repository = "https://github.com/hack-different/demuxusb-rs"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
module-name = "demuxusb"
features = ["pyo3/extension-module"]
