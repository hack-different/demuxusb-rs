[package]
name = "demuxusb-rs"
version = "0.1.0"
edition = "2021"
description = "Readers for Total Phase USB analyzer captures: native Data Center .tdc decoder and pcapng export"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hack-different/demuxusb-rs"
keywords = ["usb", "totalphase", "beagle", "pcap", "protocol-analyzer"]
categories = ["parser-implementations", "hardware-support", "command-line-utilities"]
# Test captures, IDE files and scratch C/Rust definitions are not part of the published crate.
exclude = ["/.idea", "/ext", "/usb_defs.c", "/usb_defs.rs", "/bindings", "/.github"]

[dependencies]
anyhow = "1.0"
clap = "4.5.60"
csv = "1.4.0"
hex = "0.4.3"
uuid = { version = "1.21.0", features = ["v4"] }
bitflags = "2.11.0"
pcap-file = "2.0.0-rc1"
strum = "0.28"
strum_macros = "0.28"
zerocopy = "0.9.0-alpha.0"
zerocopy-derive = "0.9.0-alpha.0"
indextree = "4.8.1"
display_tree = "1.1.2"
derivative = "2.2.0"
[workspace]
members = [".", "bindings/python", "bindings/ruby/ext/demuxusb"]
# The bindings need a Python or Ruby toolchain to build; keep plain `cargo build`/`cargo test` to the core crate.
default-members = ["."]

# The Ruby extension depends on the published crate so the gem builds outside this repo;
# inside the workspace it uses the local copy.
[patch.crates-io]
demuxusb-rs = { path = "." }
